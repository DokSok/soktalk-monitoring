# ServiceMonitor for Prometheus TSDB (scrapes via prometheus-operated Service, port web:9090)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: prometheus
  namespace: default
  labels:
    app: k8s
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  endpoints:
  - port: web
    interval: 30s
    scrapeTimeout: 10s
