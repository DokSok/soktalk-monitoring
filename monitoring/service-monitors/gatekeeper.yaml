# ServiceMonitor for Gatekeeper — scrapes admission webhook + policy metrics (port 8888)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gatekeeper
  namespace: monitoring
  labels:
    app: k8s
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gatekeeper
  endpoints:
  - port: metrics
    interval: 30s
    scrapeTimeout: 10s
    path: /metrics
  namespaceSelector:
    matchNames:
    - gatekeeper-system
