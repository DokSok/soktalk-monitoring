# ServiceMonitor for Sealed Secrets Controller (scrapes via sealed-secrets-controller Service, port controller:8080)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sealed-secrets-controller
  namespace: kube-system
  labels:
    app: k8s
spec:
  selector:
    matchLabels:
      name: sealed-secrets-controller
  endpoints:
  - port: controller
    interval: 30s
    scrapeTimeout: 10s
