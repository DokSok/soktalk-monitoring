        - 100.118.128.95:9100
      labels:
        instance: bounce
        device: fitlet2

- job_name: bounce-smart-textfile
  scrape_interval: 30s
  scrape_timeout: 25s
  static_configs:
    - targets:
        - 100.118.128.95:9100
      labels:
